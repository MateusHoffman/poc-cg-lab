[project]
name = "cg-autoagent-backend"
version = "0.1.0"
description = "PoC de busca conversacional de veículos com agente, RAG e guardrails"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "langgraph>=0.2",
    "litellm>=1.55",
    "boto3>=1.35",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "openfeature-sdk>=0.7",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
